<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YarnStash · 技术支持</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='none' stroke='white' stroke-width='2'/><path d='M8 8s4-3 8 0M8 12s4 3 8 0M8 16s4-3 8 0' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>">
<style>
  :root {
    /* ==== 主题色（薄荷绿治愈风）==== */
    --accent-start: #547C6E;
    --accent-end: #88B4A4;
    --accent: var(--accent-start);
    --accent-2: var(--accent-end);
    --accent-grad: linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%);
    --accent-glow: rgba(84, 124, 110, 0.35);

    /* ==== 深色模式 ==== */
    --bg: #0f1211;
    --surface: #161a19;
    --surface-2: #1f2522;
    --border: #2a302d;
    --text: #eef1ef;
    --muted: #8fa39a;

    /* ==== 浅色模式 ==== */
    --bg-light: #FAF8F5;
    --surface-light: #FFFFFF;
    --surface-2-light: #F2EFEA;
    --border-light: #E5E2DD;
    --text-light: #2C2C2C;
    --muted-light: #8A8A8A;
  }

  /* 浅色模式变量覆盖 */
  [data-theme="light"] {
    --bg: var(--bg-light);
    --surface: var(--surface-light);
    --surface-2: var(--surface-2-light);
    --border: var(--border-light);
    --text: var(--text-light);
    --muted: var(--muted-light);
    --accent-glow: rgba(84, 124, 110, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Noto Sans JP", "Helvetica Neue", sans-serif;
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s ease, color 0.35s ease;
  }
  a { color: var(--accent-end); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* ===== 顶部工具栏 ===== */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0 0;
  }
  .tools { display: flex; gap: 8px; align-items: center; }
  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { border-color: var(--accent); color: var(--text); }
  .btn.active {
    background: var(--accent-grad);
    color: #fff; border-color: transparent;
    font-weight: 600;
  }

  /* 颜色选择器 */
  .theme-picker {
    position: relative;
  }
  .swatches {
    display: flex; gap: 6px;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: absolute; top: 100%; right: 0; margin-top: 6px;
    opacity: 0; pointer-events: none;
    transform: translateY(-6px);
    transition: all 0.2s;
    z-index: 100;
  }
  .theme-picker.open .swatches {
    opacity: 1; pointer-events: auto; transform: translateY(0);
  }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 1px var(--accent-start); }

  /* ===== Hero ===== */
  .hero {
    padding: 56px 0 44px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    width: 64px; height: 64px; margin: 0 auto 22px;
    border-radius: 18px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 36px var(--accent-glow);
    position: relative;
    overflow: hidden;
  }
  .logo-mark::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.35), transparent 55%);
  }
  .logo-mark svg { width: 34px; height: 34px; position: relative; z-index: 1; }
  .hero h1 {
    font-size: 32px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  .hero p { color: var(--muted); font-size: 15px; max-width: 500px; margin: 0 auto; }

  .contact-bar {
    margin: 36px auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    transition: border-color 0.2s;
  }
  .contact-bar:hover { border-color: var(--accent-end); }
  .contact-bar .label { color: var(--muted); font-size: 13px; }
  .contact-bar .email { font-weight: 600; font-size: 15px; }
  .contact-btn {
    background: var(--accent-grad);
    color: #fff !important;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.15s, box-shadow 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .contact-btn:hover {
    text-decoration: none;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  /* ===== 通用 Section ===== */
  section { padding: 44px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  h2 {
    font-size: 20px; font-weight: 700; margin-bottom: 22px;
    display: flex; align-items: center; gap: 12px;
  }
  h2::before {
    content: ""; width: 4px; height: 20px; border-radius: 2px;
    background: var(--accent-grad);
  }

  /* ===== 功能指引网格 ===== */
  .feat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
  }
  .feat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .feat:hover {
    border-color: var(--accent-end);
    transform: translateY(-2px);
  }
  .feat h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
  .feat p { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .feat .icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--accent-grad);
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .feat .icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }

  /* ===== FAQ ===== */
  .faq-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    background: var(--surface);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .faq-item.open { border-color: var(--accent-end); }
  .faq-q {
    padding: 17px 20px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 14.5px;
    user-select: none;
    transition: background 0.15s;
  }
  .faq-q:hover { background: var(--surface-2); }
  .faq-q .arrow {
    transition: transform 0.22s;
    color: var(--muted); font-size: 11px;
    flex-shrink: 0; margin-left: 12px;
  }
  .faq-item.open .faq-q .arrow { transform: rotate(180deg); color: var(--accent-end); }
  .faq-a {
    max-height: 0; overflow: hidden;
    transition: max-height 0.28s ease;
  }
  .faq-a-inner {
    padding: 0 20px 18px;
    color: var(--muted); font-size: 14px; line-height: 1.8;
  }
  .faq-item.open .faq-a { max-height: 700px; }
  .faq-a-inner strong { color: var(--text); font-weight: 600; }
  .faq-a-inner a { color: var(--accent-end); }

  /* ===== 信息块 ===== */
  .info-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  .info-block p { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .info-block p:last-child { margin-bottom: 0; }
  .info-block strong { color: var(--text); }

  /* ===== 状态卡 ===== */
  .status-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .status-card .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent-end);
    box-shadow: 0 0 0 4px rgba(136,180,164,0.2);
    flex-shrink: 0;
  }
  .status-card .s-label { font-size: 12px; color: var(--muted); }
  .status-card .s-value { font-size: 15px; font-weight: 600; }

  /* ===== Footer ===== */
  footer {
    padding: 36px 0 56px;
    text-align: center;
    color: var(--muted); font-size: 12.5px;
  }
  footer .links { margin-bottom: 12px; }
  footer .links a { margin: 0 10px; }

  /* ===== Toast ===== */
  #toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); color: var(--text);
    padding: 11px 22px; border-radius: 10px; font-size: 13px;
    z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    transition: opacity 0.3s;
  }

  @media (max-width: 600px) {
    .hero { padding: 36px 0 28px; }
    .hero h1 { font-size: 24px; }
    .feat-grid, .status-grid { grid-template-columns: 1fr; }
    .contact-bar { flex-direction: column; align-items: flex-start; }
    h2 { font-size: 17px; }
    .top-bar { flex-direction: column; gap: 12px; align-items: flex-end; }
  }
</style>
</head>

  }
  for (var i = 0; i < LANGS.length; i++) {
    if (nav.indexOf(LANGS[i]) === 0) return LANGS[i];
  }
  return "en";
}

// ===== 应用语言 =====
function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang === "zh-CN" ? "zh-CN" : lang;
  var t = I18N[lang];

  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    var key = el.getAttribute("data-i18n");
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // features
  var fg = document.getElementById("featGrid");
  fg.innerHTML = "";
  t.feats.forEach(function(f) {
    var div = document.createElement("div");
    div.className = "feat";
    div.innerHTML = '<div class="icon">' + ICONS[f.icon] + '</div><h3></h3><p></p>';
    div.querySelector("h3").textContent = f.title;
    div.querySelector("p").textContent = f.desc;
    fg.appendChild(div);
  });

  // FAQ
  var fl = document.getElementById("faqList");
  fl.innerHTML = "";
  t.faqs.forEach(function(f) {
    var item = document.createElement("div");
    item.className = "faq-item";
    item.innerHTML = '<div class="faq-q" onclick="toggleFaq(this)"><span class="qtext"></span><span class="arrow">▼</span></div><div class="faq-a"><div class="faq-a-inner"></div></div>';
    item.querySelector(".qtext").textContent = f.q;
    item.querySelector(".faq-a-inner").innerHTML = f.a;
    fl.appendChild(item);
  });

  // subscription
  var sb = document.getElementById("subBlock");
  sb.innerHTML = "";
  t.subLines.forEach(function(line) {
    var p = document.createElement("p");
    p.innerHTML = line;
    sb.appendChild(p);
  });

  // status
  var sg = document.getElementById("statusGrid");
  sg.innerHTML = "";
  t.statuses.forEach(function(s) {
    var card = document.createElement("div");
    card.className = "status-card";
    card.innerHTML = '<div class="dot"></div><div><div class="s-label"></div><div class="s-value"></div></div>';
    card.querySelector(".s-label").textContent = s.label;
    card.querySelector(".s-value").textContent = s.value;
    sg.appendChild(card);
  });

  // lang buttons
  var lb = document.getElementById("langBar");
  lb.innerHTML = "";
  LANGS.forEach(function(l) {
    var b = document.createElement("button");
    b.className = "btn" + (l === lang ? " active" : "");
    b.textContent = I18N[l].langName;
    b.onclick = function() { applyLang(l); };
    lb.appendChild(b);
  });

  document.title = "YarnStash · " + t.heroTitle;
}

// ===== 主题切换 =====
function toggleTheme() {
  if (currentTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "light");
    currentTheme = "light";
    document.getElementById("themeIcon").textContent = "☀";
  } else {
    document.documentElement.removeAttribute("data-theme");
    currentTheme = "dark";
    document.getElementById("themeIcon").textContent = "◐";
  }
}

// ===== 颜色切换 =====
function applyColors(preset) {
  var root = document.documentElement;
  root.style.setProperty("--accent-start", preset.start);
  root.style.setProperty("--accent-end", preset.end);
  // 更新发光颜色
  if (currentTheme === "dark") {
    root.style.setProperty("--accent-glow", hexToRgba(preset.start, 0.35));
  } else {
    root.style.setProperty("--accent-glow", hexToRgba(preset.start, 0.15));
  }
  // 更新 active 状态
  document.querySelectorAll(".swatch").forEach(function(s) {
    s.classList.toggle("active", s.dataset.start === preset.start);
  });
}

function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

function buildSwatches() {
  var container = document.getElementById("swatches");
  container.innerHTML = "";
  COLOR_PRESETS.forEach(function(p) {
    var s = document.createElement("div");
    s.className = "swatch";
    s.style.background = "linear-gradient(135deg, " + p.start + ", " + p.end + ")";
    s.dataset.start = p.start;
    s.title = p.name;
    if (p.start === "#547C6E") s.classList.add("active");
    s.onclick = function() {
      applyColors(p);
      showToast("已切换主题色：" + p.name);
      document.getElementById("themePicker").classList.remove("open");
    };
    container.appendChild(s);
  });
}

// ===== FAQ 交互 =====
function toggleFaq(el) {
  el.parentElement.classList.toggle("open");
}

// ===== Toast =====
function showToast(msg) {
  var t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.opacity = "0"; }, 2200);
}

// ===== 初始化 =====
document.getElementById("themeToggle").addEventListener("click", toggleTheme);
document.getElementById("colorBtn").addEventListener("click", function(e) {
  e.stopPropagation();
  document.getElementById("themePicker").classList.toggle("open");
});
document.addEventListener("click", function() {
  document.getElementById("themePicker").classList.remove("open");
});

buildSwatches();
applyLang(detectLang());
</script>
